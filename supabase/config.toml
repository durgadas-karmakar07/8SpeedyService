# Supabase CLI config (only the parts this project needs).
# Edge Function JWT settings:
#   create-order / verify-payment -> called by the logged-in app (JWT required)
#   webhook -> called by Razorpay servers (no JWT; protected by HMAC signature)

[functions.razorpay-create-order]
verify_jwt = true

[functions.razorpay-verify-payment]
verify_jwt = true

[functions.razorpay-webhook]
verify_jwt = false

[functions.delete-account]
verify_jwt = true
